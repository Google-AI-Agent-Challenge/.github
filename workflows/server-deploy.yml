name: Deploy TONES Backend

on:
  push:
    branches:
      - main
    paths:
      - 'TONES_Server/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'app/**'
      - 'tests/**'
  pull_request:
    branches:
      - main
    paths:
      - 'TONES_Server/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'app/**'
      - 'tests/**'
  workflow_call:
    secrets:
      GCP_SA_KEY:
        required: true

jobs:
  test-and-validate:
    name: 🧪 Run Pytest & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -d "TONES_Server" ]; then
            pip install -r TONES_Server/requirements.txt
          else
            pip install -r requirements.txt
          fi
          pip install pytest httpx pytest-asyncio

      - name: Run Tests
        env:
          PROJECT_NAME: "TONES Server"
          API_V1_STR: "/api/v1"
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          SUPABASE_URL: "https://example.supabase.co"
          SUPABASE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy_anon_key"
          SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy_service_role_key"
          PINECONE_API_KEY: "dummy-pinecone-api-key"
          PINECONE_ENVIRONMENT: "us-east-1"
          PINECONE_INDEX_NAME: "dummy-index"
          SECRET_KEY: "github-actions-ci-secret-key-123456789"
          GEMINI_API_KEY: "dummy-gemini-api-key"
        run: |
          if [ -d "TONES_Server" ]; then
            cd TONES_Server
          fi
          python -m pytest

  docker-check:
    name: 🐳 Verify Docker Build Integrity (Dry-Run)
    runs-on: ubuntu-latest
    needs: test-and-validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry-Run)
        run: |
          if [ -d "TONES_Server" ]; then
            docker build --no-cache -t tones-server:test ./TONES_Server
          else
            docker build --no-cache -t tones-server:test .
          fi

  deploy-to-gcp:
    name: 🚀 Deploy to Google Cloud Run
    needs: docker-check
    runs-on: ubuntu-latest
    # push 이벤트이며 main 브랜치일 때 또는 Reusable Workflow 호출(workflow_call)일 때 배포를 진행합니다.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_call'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit Cloud Build
        run: |
          if [ -d "TONES_Server" ]; then
            gcloud builds submit --config TONES_Server/cloudbuild.yaml TONES_Server
          else
            gcloud builds submit --config cloudbuild.yaml .
          fi
